name: Build mod jar

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: nevvavisuals-jar
          path: build/libs/nevvavisuals-*.jar
          if-no-files-found: error

      - name: Publish jar to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NevvaVisuals — latest build
          body: |
            Автоматическая сборка мода NevvaVisuals для Minecraft 1.21.4 (Fabric).
            Скачайте `nevvavisuals-1.0.0.jar` ниже и положите в папку `mods`.
          files: build/libs/nevvavisuals-*.jar
          make_latest: true
          prerelease: false
